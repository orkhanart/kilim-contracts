[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 64, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 256, depth = 128, fail_on_revert = true }

[fmt]
line_length = 110
