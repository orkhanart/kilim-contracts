[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 64, fail_on_revert = true }
# The deploy tests put about 900 KB of chunks on the chain twice (dry run, then for real): several
# hundred million gas, above the default limit of 2^30 per test.
gas_limit = 4000000000
# The deploy script and its test read the packed stores (manifests, chunks) and the deploy configs.
fs_permissions = [{ access = "read", path = "../onchain" }, { access = "read", path = "./deploy" }]

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 256, depth = 128, fail_on_revert = true }

# Differential tests that shell out to onchain/render_ref.py. Opt in: pnpm test:render-ffi.
[profile.ffi]
ffi = true
fuzz = { runs = 64 }

[fmt]
line_length = 110
