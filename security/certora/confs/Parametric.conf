{
    // Local run only (see ../README.md): run.sh passes --jar, never a server or a key.
    // Relative paths are from contracts/security/certora; run.sh re-roots them per run.
    "files": ["harness/KilimAuctionHarness.sol", "harness/OneOfOneMock.sol"],
    "verify": "KilimAuctionHarness:specs/Parametric.spec",
    "solc": "solc8.37",
    "solc_optimize": "200",
    "solc_evm_version": "cancun",
    "packages": [
        "@openzeppelin/contracts=../../node_modules/@openzeppelin/contracts",
        "kilim=../../src"
    ],
    "solc_allow_path": "../..",
    "optimistic_loop": true,
    "loop_iter": "3",
    "rule_sanity": "basic",
    // No event stream (the jar would otherwise try an AWS SQS queue; nothing here has AWS credentials).
    "prover_args": ["-enableEventReporting false"],
    "msg": "Kilim auction: only-X-changes-Y rules"
}
